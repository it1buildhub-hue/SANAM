    <text y="28" fill="#0EA5E9" font-weight="700">✦ <tspan fill="#E2E8F0" font-weight="600">Instant Demo Sandboxes:</tspan> <tspan fill="#94A3B8">Spins up sample data on dedicated port </tspan><tspan fill="#FCEFD2" font-family="monospace">8083</tspan><tspan fill="#94A3B8">.</tspan></text>
    <text y="56" fill="#0EA5E9" font-weight="700">✦ <tspan fill="#E2E8F0" font-weight="600">Self-Contained Execution:</tspan> <tspan fill="#94A3B8">Zero Apache/Nginx configuration needed.</tspan></text>
  </g>

