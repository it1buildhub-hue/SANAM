  <text x="32" y="246" font-family="monospace" font-size="11" font-weight="600" fill="#38BDF8">★ SINGLE COMMAND EXECUTION</text>
  <text x="508" y="246" font-family="monospace" font-size="11" font-weight="600" fill="#FCEFD2" text-anchor="end">PRODUCTION &amp; DEMO MODES</text>
