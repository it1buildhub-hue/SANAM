<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 270" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091420"/>
      <stop offset="50%" stop-color="#060C14"/>
      <stop offset="100%" stop-color="#03060A"/>
    </linearGradient>
    <linearGradient id="borderGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#C4A477" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0B2033" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="glow4" cx="15%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0B0E17" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="540" height="270" rx="14" fill="url(#cardBg4)" stroke="url(#borderGrad4)" stroke-width="1.6"/>
  <rect width="540" height="270" rx="14" fill="url(#glow4)"/>

  <!-- Icon Badge -->
  <g transform="translate(30, 26)">
    <rect width="44" height="44" rx="10" fill="#0C2030" stroke="#0EA5E9" stroke-width="1.2"/>
    <text x="22" y="29" font-size="22" text-anchor="middle">⚡</text>
  </g>

  <!-- Card Category Tag -->
  <rect x="86" y="28" width="155" height="22" rx="11" fill="#0A2234" stroke="#0EA5E9" stroke-width="0.8"/>
  <circle cx="98" cy="39" r="3.5" fill="#0EA5E9"/>
  <text x="108" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#38BDF8" letter-spacing="1.2">1-CLICK AUTOMATION</text>

  <!-- Card Title & Subtitle -->
  <text x="86" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#FCEFD2">Automated Provisioning</text>
  <text x="32" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#E5C78A" font-weight="500">Zero database setup headaches. Deploy production or sandbox in 60s.</text>

  <!-- Bullets -->
  <g transform="translate(32, 126)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5">
