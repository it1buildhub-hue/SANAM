<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C4A477" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#8F6E3E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#07090E" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E17"/>
      <stop offset="50%" stop-color="#05070B"/>
      <stop offset="100%" stop-color="#0A0C12"/>
    </linearGradient>

    <!-- Metallic Gold Foil Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DFBA73"/>
      <stop offset="25%" stop-color="#FCEFD2"/>
      <stop offset="50%" stop-color="#C4A477"/>
      <stop offset="75%" stop-color="#E5C78A"/>
      <stop offset="100%" stop-color="#A57D3E"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C4A477" stop-opacity="0"/>
      <stop offset="30%" stop-color="#C4A477" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFF2D6" stop-opacity="1"/>
      <stop offset="70%" stop-color="#C4A477" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C4A477" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#C4A477" stroke-width="0.75" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#cyberGrid)"/>
  <ellipse cx="600" cy="180" rx="480" ry="180" fill="url(#goldGlow)"/>

  <!-- Outer Border Frame with Gold Accents -->
  <rect x="20" y="20" width="1160" height="320" rx="16" fill="none" stroke="#C4A477" stroke-width="1.2" stroke-opacity="0.35"/>
  <rect x="28" y="28" width="1144" height="304" rx="12" fill="none" stroke="#C4A477" stroke-width="0.6" stroke-opacity="0.15"/>

  <!-- Corner Brackets -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="url(#goldMetallic)" stroke-width="3"/>
  <path d="M 1180 50 L 1180 20 L 1150 20" fill="none" stroke="url(#goldMetallic)" stroke-width="3"/>
  <path d="M 20 310 L 20 340 L 50 340" fill="none" stroke="url(#goldMetallic)" stroke-width="3"/>
  <path d="M 1180 310 L 1180 340 L 1150 340" fill="none" stroke="url(#goldMetallic)" stroke-width="3"/>

  <!-- Category / Status Pill -->
  <g transform="translate(600, 72)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#0E121B" stroke="#C4A477" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="-116" cy="0" r="4.5" fill="#10B981"/>
    <text x="-98" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2.5" fill="#E5C78A">ENTERPRISE ASSET SYSTEM</text>
  </g>

  <!-- Title: SANAM -->
  <text x="600" y="172" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', 'Georgia', serif" font-size="78" font-weight="900" letter-spacing="22" fill="url(#goldMetallic)" text-anchor="middle">
    SANAM
  </text>

  <!-- Accent Divider Line -->
  <path d="M 320 202 L 880 202" stroke="url(#lineGrad)" stroke-width="1.8"/>
  <polygon points="600,198 605,202 600,206 595,202" fill="#FFF2D6"/>

  <!-- Subtitle Tagline -->
  <text x="600" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" letter-spacing="6" fill="#F3E5AB" text-anchor="middle">
    IMMUTABLE ASSET IDENTITY • MOBILE QR FIELD AUDIT • CUSTODY CLEARANCE
  </text>

  <!-- Feature Highlights Row -->
  <g transform="translate(600, 290)">
    <!-- Pill 1 -->
    <rect x="-340" y="-12" width="150" height="24" rx="12" fill="#090C12" stroke="#C4A477" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="-265" y="4" font-family="monospace" font-size="11" font-weight="600" fill="#E5C78A" text-anchor="middle">🏷️ SNM-000001</text>
    
    <!-- Pill 2 -->
    <rect x="-170" y="-12" width="150" height="24" rx="12" fill="#090C12" stroke="#C4A477" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="-95" y="4" font-family="monospace" font-size="11" font-weight="600" fill="#E5C78A" text-anchor="middle">📱 ZERO-APP SCAN</text>

    <!-- Pill 3 -->
    <rect x="20" y="-12" width="160" height="24" rx="12" fill="#090C12" stroke="#C4A477" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="100" y="4" font-family="monospace" font-size="11" font-weight="600" fill="#E5C78A" text-anchor="middle">📋 CUSTODY TRAIL</text>

    <!-- Pill 4 -->
    <rect x="200" y="-12" width="150" height="24" rx="12" fill="#090C12" stroke="#C4A477" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="275" y="4" font-family="monospace" font-size="11" font-weight="600" fill="#E5C78A" text-anchor="middle">⚡ 1-CLICK DEPLOY</text>
  </g>
</svg>
