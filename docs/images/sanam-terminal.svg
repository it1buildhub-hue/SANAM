<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121B"/>
      <stop offset="100%" stop-color="#06080D"/>
    </linearGradient>
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C4A477" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FCEFD2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8F6E3E" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="2" y="2" width="896" height="376" rx="14" fill="url(#termBg)" stroke="url(#termBorder)" stroke-width="1.8"/>

  <!-- Window Header Bar -->
  <rect x="2" y="2" width="896" height="42" rx="14" fill="#141924"/>
  <rect x="2" y="32" width="896" height="12" fill="#141924"/>
  <line x1="2" y1="44" x2="898" y2="44" stroke="#C4A477" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Window Control Buttons -->
  <circle cx="24" cy="23" r="6" fill="#FF5F56"/>
  <circle cx="44" cy="23" r="6" fill="#FFBD2E"/>
  <circle cx="64" cy="23" r="6" fill="#27C93F"/>

  <!-- Window Title -->
