    <!-- Scan Outputs -->
    <text x="30" y="118" fill="#10B981">✔ <tspan fill="#8B949E">[0.012s]</tspan> <tspan fill="#F3E5AB">QR Code Decoded:</tspan> <tspan fill="#C4A477">https://sanam.local/scan?id=SNM-000412</tspan></text>
    <text x="30" y="148" fill="#10B981">✔ <tspan fill="#8B949E">[0.019s]</tspan> <tspan fill="#F3E5AB">Asset Record:</tspan> <tspan fill="#FFFFFF">Dell Latitude 5420 • i7-1185G7 • 32GB RAM • 512GB NVMe</tspan></text>
    <text x="30" y="178" fill="#10B981">✔ <tspan fill="#8B949E">[0.024s]</tspan> <tspan fill="#F3E5AB">Custody Holder:</tspan> <tspan fill="#E5C78A">Omar Mohammed</tspan> <tspan fill="#8B949E">(Yard Operations Division)</tspan></text>
    <text x="30" y="208" fill="#10B981">✔ <tspan fill="#8B949E">[0.031s]</tspan> <tspan fill="#F3E5AB">Serial Validation:</tspan> <tspan fill="#FFFFFF">4HG92B3</tspan> <tspan fill="#10B981">[COLLISION CHECK: 0 DUPLICATES]</tspan></text>
    <text x="30" y="238" fill="#10B981">✔ <tspan fill="#8B949E">[0.038s]</tspan> <tspan fill="#F3E5AB">Location Match:</tspan> <tspan fill="#FFFFFF">Sharjah Office &amp; Yard • Sub-location: Counter 02</tspan></text>
    <text x="30" y="268" fill="#10B981">✔ <tspan fill="#8B949E">[0.045s]</tspan> <tspan fill="#F3E5AB">Audit Log Reconciled:</tspan> <tspan fill="#C4A477">MariaDB Commit #892819 [CAMPAIGN_VERIFIED]</tspan></text>

    <!-- Success Highlight Banner -->
    <rect x="30" y="296" width="840" height="42" rx="8" fill="#0C281E" stroke="#10B981" stroke-width="1.2"/>
    <text x="50" y="322" fill="#10B981" font-weight="700">★ RESULT: ASSET COMPLIANT • ZERO DISCREPANCIES • SIGN-OFF REGISTERED</text>
    <text x="850" y="322" fill="#E5C78A" font-weight="600" text-anchor="end">STATUS: 100% PASS</text>
