<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 270" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181309"/>
      <stop offset="50%" stop-color="#0F0C05"/>
      <stop offset="100%" stop-color="#080602"/>
    </linearGradient>
    <linearGradient id="borderGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBA73" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#C4A477" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3A2B14" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="glow2" cx="15%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#DFBA73" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0B0E17" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="540" height="270" rx="14" fill="url(#cardBg2)" stroke="url(#borderGrad2)" stroke-width="1.6"/>
  <rect width="540" height="270" rx="14" fill="url(#glow2)"/>

  <!-- Icon Badge -->
  <g transform="translate(30, 26)">
    <rect width="44" height="44" rx="10" fill="#241B0A" stroke="#DFBA73" stroke-width="1.2"/>
    <text x="22" y="29" font-size="22" text-anchor="middle">🔒</text>
  </g>

  <!-- Card Category Tag -->
  <rect x="86" y="28" width="155" height="22" rx="11" fill="#241C0C" stroke="#DFBA73" stroke-width="0.8"/>
  <circle cx="98" cy="39" r="3.5" fill="#DFBA73"/>
  <text x="108" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#DFBA73" letter-spacing="1.2">TAMPER-PROOF IDENTITY</text>

  <!-- Card Title & Subtitle -->
  <text x="86" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#FCEFD2">Immutable Asset Identity</text>
  <text x="32" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#E5C78A" font-weight="500">Every piece of hardware receives one lifetime identifier.</text>

  <!-- Bullets -->
  <g transform="translate(32, 126)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5">
    <text y="0" fill="#DFBA73" font-weight="700">✦ <tspan fill="#E2E8F0" font-weight="600">Sequential ID Engine:</tspan> <tspan fill="#94A3B8">Permanent </tspan><tspan fill="#FCEFD2" font-family="monospace">SNM-000001</tspan><tspan fill="#94A3B8"> lifecycle standard.</tspan></text>
    <text y="28" fill="#DFBA73" font-weight="700">✦ <tspan fill="#E2E8F0" font-weight="600">Zero-Collision Logic:</tspan> <tspan fill="#94A3B8">Blocks duplicate serials across databases.</tspan></text>
    <text y="56" fill="#DFBA73" font-weight="700">✦ <tspan fill="#E2E8F0" font-weight="600">Audit Provenance:</tspan> <tspan fill="#94A3B8">Retains full history through transfers &amp; repairs.</tspan></text>
  </g>

  <!-- Footer Tag -->
  <line x1="32" y1="222" x2="508" y2="222" stroke="#DFBA73" stroke-opacity="0.2" stroke-width="1"/>
  <text x="32" y="246" font-family="monospace" font-size="11" font-weight="600" fill="#DFBA73">★ NEVER REUSED • NEVER PURGED</text>
  <text x="508" y="246" font-family="monospace" font-size="11" font-weight="600" fill="#FCEFD2" text-anchor="end">STRICT VALIDATION ON COMMIT</text>
</svg>
